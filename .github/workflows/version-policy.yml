name: Version policy

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  protect-main-content:
    if: github.ref_name == 'main' || github.base_ref == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject development-only test scripts
        shell: pwsh
        run: |
          $testScripts = @(git ls-files -- "src/Powershell/TestEnvironment" | Where-Object { $_ -like "*.ps1" })

          if ($testScripts.Count -gt 0) {
              Write-Error "Development-only TestEnvironment scripts must not be included in main: $($testScripts -join ', ')"
              exit 1
          }

  validate-version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Validate version and changed files
        shell: pwsh
        run: |
          ./build/Update-Version.ps1 -Check -BaseRef HEAD^