name: Version policy

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-version:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and changed files
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ($env:EVENT_NAME -eq "pull_request") {
              $baseRef = "origin/$env:BASE_BRANCH"
          }
          elseif ($env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
              $baseRef = $env:BEFORE_SHA
          }
          else {
              $baseRef = "HEAD^"
          }

          ./build/Update-Version.ps1 -Check -BaseRef $baseRef